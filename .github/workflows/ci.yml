name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only the repo-specific jobs at the bottom of this file read these. A called
# workflow does not inherit caller-level `env:`; the reusable workflow declares
# its own copy of exactly the same three.
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -Dwarnings

jobs:
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@9234e1fa9f85b14a8d6fddc7a8f7378f7e30b183
    with:
      # The old `test` job ran on ubuntu-latest only. `true` would newly gate on
      # macOS and Windows, which nothing here has ever been shown to pass.
      os-matrix: false
      # The old MSRV job ran `cargo test` on 1.85, not a bare build. The floor
      # needs no input: all three members declare rust-version "1.85", so the
      # workflow derives the same 1.85 the job was pinned to.
      msrv-check: test
      # There was NO coverage job in this repo, so `strict` would not be
      # inherited — it would be imposed, and it would fail. Measured instead, on
      # this branch, with the command the shared workflow runs:
      #   cargo llvm-cov --workspace --all-features --summary-only
      #   -> TOTAL lines 94.49% (cli/src/main.rs, a 9-line binary shim, is 0%)
      # The floor is floor(measured) = 94: a regression backstop at today's real
      # number rather than a target nobody has met.
      coverage-gate: floor
      coverage-floor: 94
      # The repo's own deny.toml, not the shared fleet config. Local is strictly
      # STRICTER: `[bans] multiple-versions = "deny"` (shared: "warn") and
      # `[advisories] ignore = []` (shared: 21 RUSTSEC ignores). Adopting the
      # shared file would loosen this gate, which an adoption PR must not do.
      deny-config-repo: ""
      # cargo-deny-action defaults its `arguments` input to `--all-features`, so
      # the old job checked the full-feature dependency graph. Carry that across.
      deny-args: --all-features

  # ---------------------------------------------------------------------------
  # Repo-specific jobs, copied verbatim from the pre-adoption ci.yml.
  # ---------------------------------------------------------------------------

  # crates.io only gates `description` + `license`, not README/LICENSE-file. This
  # job asserts every publishable crate actually *packages* a README and LICENSE,
  # so a release can never ship without them (as 0.1.1 did).
  package:
    name: Package completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: README + LICENSE packaged in every published crate
        run: |
          set -euo pipefail
          pkgs=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json;[print(p['name']) for p in json.load(sys.stdin)['packages'] if p.get('publish') != []]")
          for p in $pkgs; do
            list=$(cargo package -p "$p" --list)
            echo "$list" | grep -qx 'README.md' || { echo "::error::$p does not package README.md"; exit 1; }
            echo "$list" | grep -q '^LICENSE'   || { echo "::error::$p does not package a LICENSE file"; exit 1; }
            echo "✓ $p packages README.md + LICENSE"
          done

  geiger:
    name: Unsafe Audit (cargo-geiger)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
        with:
          cache-on-failure: true
      - run: cargo install cargo-geiger --locked
      - run: cargo geiger 2>&1 || true
